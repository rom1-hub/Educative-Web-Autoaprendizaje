name: Python optimization validation

on:
  push:
    branches:
      - python-optimizacion
  pull_request:
    branches:
      - python-optimizacion

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install fastapi pydantic

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate canonical verb catalogs
        run: node ../scripts/migrate-verb-data-to-json.js

      - name: Upload generated canonical verb catalogs
        uses: actions/upload-artifact@v4
        with:
          name: canonical-verb-catalogs
          path: backend/data/verbs/*.json

      - name: Compile Python sources
        run: python -m compileall -q app

      - name: Validate backend import
        env:
          PYTHONPATH: .
        run: python -c "from app.main import app; print('Backend import OK:', app.title)"

      - name: Validate 7,116-verb legacy fallback
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          from app.core.conjugation_engine import ConjugationEngine
          from app.modules.conjugation.exercise_service import ExerciseService
          from app.modules.conjugation.repository import ConjugationRepository

          repository = ConjugationRepository("data/verbs")
          repository.load()

          verbs = repository.list_verbs()
          legacy_only = [verb for verb in verbs if verb.familyId is None]

          assert len(verbs) == 7116, len(verbs)
          assert len(legacy_only) == 7003, len(legacy_only)
          assert all(verb.patternId is None for verb in legacy_only)
          assert all(verb.legacy_formes for verb in legacy_only)

          engine = ConjugationEngine(repository)
          result = engine.conjugate_verb(
              verb_id="abaisser",
              tense_id="présent de l'indicatif",
          )
          assert result["source"] == "legacy"
          assert result["family"] is None
          assert result["pattern"] is None
          assert result["legacy_forms"] is not None

          service = ExerciseService(repository)
          questions = service.generate_exercise_set(
              groups=[1, 2, 3],
              family_id=None,
              tense_ids=["présent de l'indicatif"],
              limit=30,
          )
          assert len(questions) == 30
          counts = {group: 0 for group in (1, 2, 3)}
          for question in questions:
              counts[question["group"]] += 1
          assert counts == {1: 10, 2: 10, 3: 10}, counts

          print("7,116-verb legacy fallback validation OK")
          PY

      - name: Validate vocabulary exercise service
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          from pathlib import Path

          from app.modules.vocabulary.exercise_service import VocabularyExerciseService
          from app.modules.vocabulary.repository import VocabularyRepository

          repository = VocabularyRepository(
              Path("data/vocabulary/vocabulary.json")
          )
          repository.load()

          service = VocabularyExerciseService(repository)
          questions = service.generate_vocabulary_exercise(
              category_id="animales",
              subcategory_id="animales-domesticos",
              type="multiple_choice",
              limit=5,
          )

          assert len(questions) == 5
          assert all(len(question["options"]) == 4 for question in questions)
          assert all(
              question["correct_answer"] in question["options"]
              for question in questions
          )
          assert len({question["item_id"] for question in questions}) == 5

          print("Vocabulary exercise validation OK")
          PY
