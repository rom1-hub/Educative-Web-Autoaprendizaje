name: Build local verb database

on:
  push:
    branches: [test-base-datos]

permissions:
  contents: write

jobs:
  build:
    if: "!contains(github.event.head_commit.message, '[skip database]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build database
        run: node scripts/build-local-verb-database.js
      - name: Commit generated database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/verbs/local-database.js
          if git diff --cached --quiet; then
            echo "Database already up to date"
            exit 0
          fi
          git commit -m "Materializa base local de verbos [skip database]"
          git push
