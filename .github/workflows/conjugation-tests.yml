name: Conjugation tests

on:
  push:
    branches:
      - optimizacion-limpieza
    paths:
      - "conjugacion.html"
      - "js/conjugation*.js"
      - "backend/**"
      - "requirements.txt"
      - "data/verbs/**"
      - "tests/**"
      - ".github/workflows/conjugation-tests.yml"
  pull_request:
    branches:
      - optimizacion-limpieza
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Run JavaScript and Python tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run remaining JavaScript tests
        run: node --test tests/*.test.js
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Run Python practice tests
        run: python -m unittest discover -s tests -p "test_*.py"
