name: Conjugation tests

on:
  push:
    branches:
      - optimizacion-limpieza
    paths:
      - "conjugacion.html"
      - "js/conjugation*.js"
      - "data/verbs/**"
      - "tests/**"
      - ".github/workflows/conjugation-tests.yml"
  pull_request:
    branches:
      - optimizacion-limpieza
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Run conjugation tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run test suite
        run: node --test tests/*.test.js
