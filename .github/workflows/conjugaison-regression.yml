name: Conjugaison regression

on:
  push:
    branches: [audit-arquitectura]
  pull_request:
    branches: [audit-arquitectura]

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run conjugaison regression
        run: node tests/conjugaison-regression.node.js
