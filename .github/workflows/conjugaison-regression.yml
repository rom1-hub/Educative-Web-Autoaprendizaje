name: Conjugaison regression

on:
  push:
  pull_request:

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Run conjugaison regression
        run: node tests/conjugaison-regression.node.js
      - name: Run practice distribution regression
        run: node tests/conjugaison-practice-distribution.node.js
      - name: Run subject model regression
        run: node tests/conjugaison-subject-model.node.js
