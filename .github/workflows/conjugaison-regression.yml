name: Conjugaison regression

on:
  push:
  pull_request:

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Run category API regression
        run: node tests/conjugaison-category-api.node.js
      - name: Run family inventory regression
        run: node tests/conjugaison-family-inventory.node.js
      - name: Run category-family coverage regression
        run: node tests/conjugaison-category-family-coverage.node.js
      - name: Run family resolver ownership regression
        run: node tests/conjugaison-family-resolver.node.js
      - name: Run construction resolver regression
        run: node tests/conjugaison-construction-resolver.node.js
      - name: Run auxiliary resolver regression
        run: node tests/conjugaison-auxiliary-resolver.node.js
      - name: Run tense rules ownership regression
        run: node tests/conjugaison-tense-rules.node.js
      - name: Run subject model regression
        run: node tests/conjugaison-subject-model.node.js
      - name: Run conjugaison regression
        run: node tests/conjugaison-regression.node.js
      - name: Run practice distribution regression
        run: node tests/conjugaison-practice-distribution.node.js
